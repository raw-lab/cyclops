[package]
name        = "cyclops-core"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "Cyclops core algorithms: tunable PSF, blind deconvolution, Richardson–Lucy, Otsu, region props, calibration, ML-based organism classification."

[lib]
name = "cyclops_core"
path = "src/lib.rs"

[dependencies]
ndarray            = { workspace = true }
num-complex        = { workspace = true }
num-traits         = { workspace = true }
rustfft            = { workspace = true }
rayon              = { workspace = true }
image              = { workspace = true }
tiff               = { workspace = true }
polars             = { workspace = true }
plotters           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
linfa              = { workspace = true }
linfa-clustering   = { workspace = true }
chrono             = { workspace = true }
walkdir            = { workspace = true }
once_cell          = { workspace = true }

# ONNX backend (optional). tract is pure-Rust — no C++ ONNX Runtime to
# download or bundle — which keeps Cyclops a single self-contained binary.
# tract-onnx re-exports ndarray via `tract_onnx::prelude::tract_ndarray`.
tract-onnx         = { version = "0.23", optional = true }

[features]
default = []
# Optional ONNX deep-learning back-end (off by default; keeps install dependency-free)
onnx    = ["dep:tract-onnx"]

[dev-dependencies]
tempfile = "3"
