[package]
name          = "cyclops"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.85"
license       = "CC-BY-NC-4.0"
authors       = [
    "Jose Luis Figueroa III <jlfiguer@charlotte.edu>",
    "Sadie M. Hollenack",
    "Richard Allen White III <rwhit101@uncc.edu>",
]
repository    = "https://github.com/raw-lab/cyclops"
homepage      = "https://github.com/raw-lab/cyclops"
description   = "Cyclops — formerly EpiVirQuant. Sizes and counts viral-like particles, bacteria, archaea, and protists in epifluorescence microscopy via tunable blind deconvolution."
readme        = "README.md"
keywords      = ["bioinformatics", "microscopy", "deconvolution", "virology", "microbiome"]
categories    = ["science", "command-line-utilities", "visualization"]

# Only ship what the published crate needs. Keeps the uploaded tarball
# small and reproducible (no target/, no dev scratch, no results/).
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "assets/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "docs/**/*.md",
]

# ---------------------------------------------------------------------------
#  ONE library + TWO binaries, all in this single crate/package.
#  crates.io publishes this as exactly one crate.
# ---------------------------------------------------------------------------
[lib]
# Library name kept as `cyclops_core` so `use cyclops_core::…` in the
# binaries and tests continues to resolve unchanged.
name = "cyclops_core"
path = "src/lib.rs"

[[bin]]
name = "cyclops"
path = "src/bin/cyclops.rs"

[[bin]]
name = "cyclops-gui"
path = "src/bin/cyclops-gui/main.rs"
# The GUI only builds when the `gui` feature is enabled, so a default
# `cargo install cyclops` (library + CLI) stays lightweight and doesn't
# pull the eframe/egui/rfd graphics stack.
required-features = ["gui"]

# ---------------------------------------------------------------------------
#  Features
# ---------------------------------------------------------------------------
[features]
default = []
# Desktop GUI (eframe/egui/rfd). Enable with: cargo install cyclops --features gui
gui  = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]
# Optional ONNX classifier backend (pure-Rust tract; no C++ runtime).
onnx = ["dep:tract-onnx"]

# ---------------------------------------------------------------------------
#  Dependencies
# ---------------------------------------------------------------------------
[dependencies]
# numerics
ndarray            = { version = "0.15", features = ["serde", "rayon"] }
num-complex        = "0.4"
num-traits         = "0.2"
rustfft            = "6.2"
rayon              = "1.10"

# image I/O
image              = { version = "0.24", default-features = false, features = ["png", "jpeg", "tiff"] }
tiff               = "0.9"

# dataframes + plotting
polars             = { version = "0.46", features = ["lazy", "csv", "parquet", "json", "polars-io", "performant", "dtype-full"] }
plotters           = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "ttf", "fontconfig-dlopen", "all_series", "colormaps", "full_palette"] }

# CLI
clap               = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# serde / config
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"

# logging / errors
thiserror          = "1.0"
anyhow             = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ML (classical, pure-rust)
linfa              = { version = "0.7", default-features = false }
linfa-clustering   = { version = "0.7", default-features = false }

# misc
indicatif          = "0.17"
chrono             = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir            = "2.5"
once_cell          = "1.19"

# --- optional: GUI (behind `gui` feature) ---
eframe             = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui               = { version = "0.27", optional = true }
egui_extras        = { version = "0.27", features = ["image", "svg"], optional = true }
rfd                = { version = "0.14", optional = true }

# --- optional: ONNX backend (behind `onnx` feature) ---
tract-onnx         = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = "3"

# ---------------------------------------------------------------------------
#  Build profiles
# ---------------------------------------------------------------------------
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-dbg]
inherits   = "release"
debug      = true
strip      = "none"

[profile.dev]
debug = 0
strip = "debuginfo"
opt-level = 0
codegen-units = 256
incremental = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 16
strip = "symbols"
debug = false
incremental = false
