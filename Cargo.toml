[workspace]
resolver = "2"
members = [
    "cyclops-core",
    "cyclops-cli",
    "cyclops-gui",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.85"
license       = "CC-BY-NC-4.0"
authors       = [
    "Jose Luis Figueroa III <jlfiguer@charlotte.edu>",
    "Sadie M. Hollenack",
    "Richard Allen White III <rwhit101@uncc.edu>",
]
repository    = "https://github.com/raw-lab/cyclops"
homepage      = "https://github.com/raw-lab/cyclops"
description   = "Cyclops — formerly EpiVirQuant. Sizes and counts viral-like particles, bacteria, archaea, and protists in epifluorescence microscopy via tunable blind deconvolution."
keywords      = ["bioinformatics", "microscopy", "deconvolution", "virology", "microbial-ecology"]
categories    = ["science", "command-line-utilities", "visualization"]

[workspace.dependencies]
# numerics
ndarray            = { version = "0.15", features = ["serde", "rayon"] }
num-complex        = "0.4"
num-traits         = "0.2"
rustfft            = "6.2"
rayon              = "1.10"

# image I/O
image              = { version = "0.24", default-features = false, features = ["png", "jpeg", "tiff"] }
tiff               = "0.9"

# dataframes + plotting
polars             = { version = "0.46", features = ["lazy", "csv", "parquet", "json", "polars-io", "performant", "dtype-full"] }
plotters           = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "ttf", "fontconfig-dlopen", "all_series", "colormaps", "full_palette"] }

# CLI
clap               = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# serde
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"

# logging / errors
thiserror          = "1.0"
anyhow             = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# GUI
eframe             = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui               = "0.27"
egui_extras        = { version = "0.27", features = ["image", "svg"] }
rfd                = "0.14"

# ML (classical, pure-rust)
linfa              = { version = "0.7", default-features = false }
linfa-clustering   = { version = "0.7", default-features = false }

# misc
indicatif          = "0.17"
chrono             = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir            = "2.5"
once_cell          = "1.19"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-dbg]
inherits   = "release"
debug      = true
strip      = "none"

[profile.dev]
debug = 0
strip = "debuginfo"
opt-level = 0
codegen-units = 256
incremental = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 16
strip = "symbols"
debug = false
incremental = false
